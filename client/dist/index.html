    <script>
      // Stamp the theme before first paint. Without this, a dark-mode user sees a
      // white flash on every load — and that single frame undoes the whole
      // impression of a polished app. See docs/DESIGN.md §8.
      (function () {
        try {
          var saved = localStorage.getItem('sanctio-theme');
          var theme =
            saved ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
